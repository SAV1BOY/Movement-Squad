# ============================================================================
# Champion Registry — Registro de Champions
# ============================================================================
# Registro detalhado de todos os champions do movimento. Champions são
# membros que vão além da participação — eles evangelizam, co-criam e
# fortalecem o movimento organicamente.
#
# Tier: seed | bronze | silver | gold | platinum
# Status: ativo | em-pausa | inativo | alumni
# ============================================================================

