# ============================================================================
# Experiment Log — Log de Experimentos
# ============================================================================
# Registro de todos os experimentos realizados pelo squad. Cada experimento
# segue o ciclo: hipótese → design → execução → resultado → decisão.
# Documentar experimentos é essencial para aprendizado cumulativo.
#
# Status: planejado | em-execucao | concluido | cancelado
# Resultado: validado | invalidado | inconclusivo
# ============================================================================

